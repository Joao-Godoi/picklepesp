<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}PicklePesp{% endblock %}</title>
    {% load static %}
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="{% url 'home' %}" class="brand">
                <div class="brand-icon">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <path d="M9 12l2 2 4-4"/>
                    </svg>
                </div>
                <span class="brand-text">PicklePesp</span>
            </a>
            <nav class="hidden sm:flex items-center gap-1">
                <a href="{% url 'home' %}"
                   class="px-3 py-1.5 rounded-lg text-xs font-semibold uppercase tracking-wider
                          {% block nav-home-class %}text-slate-400 hover:text-slate-200 hover:bg-slate-800{% endblock %}">
                    Inicio
                </a>
                <a href="{% url 'groups' %}"
                   class="px-3 py-1.5 rounded-lg text-xs font-semibold uppercase tracking-wider
                          {% block nav-groups-class %}text-slate-400 hover:text-slate-200 hover:bg-slate-800{% endblock %}">
                    Grupos
                </a>
                <a href="{% url 'playoffs' %}"
                   class="px-3 py-1.5 rounded-lg text-xs font-semibold uppercase tracking-wider
                          {% block nav-playoffs-class %}text-slate-400 hover:text-slate-200 hover:bg-slate-800{% endblock %}">
                    Playoffs
                </a>
                <a href="{% url 'placements' %}"
                   class="px-3 py-1.5 rounded-lg text-xs font-semibold uppercase tracking-wider
                          {% block nav-placements-class %}text-slate-400 hover:text-slate-200 hover:bg-slate-800{% endblock %}">
                    Posicoes
                </a>
            </nav>
        </div>
    </header>

    <main class="content-area page-content">
        {% block content %}{% endblock %}
    </main>

    <nav class="nav-bottom">
        <div class="nav-bottom-inner">
            <a href="{% url 'home' %}" class="nav-item {% block nav-home-active %}{% endblock %}">
                <div class="nav-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/>
                        <polyline points="9 22 9 12 15 12 15 22"/>
                    </svg>
                </div>
                <span class="nav-label">Inicio</span>
            </a>
            <a href="{% url 'groups' %}" class="nav-item {% block nav-groups-active %}{% endblock %}">
                <div class="nav-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                </div>
                <span class="nav-label">Grupos</span>
            </a>
            <a href="{% url 'playoffs' %}" class="nav-item {% block nav-playoffs-active %}{% endblock %}">
                <div class="nav-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="8 6 2 12 8 18"/>
                        <polyline points="16 6 22 12 16 18"/>
                    </svg>
                </div>
                <span class="nav-label">Playoffs</span>
            </a>
            <a href="{% url 'placements' %}" class="nav-item {% block nav-placements-active %}{% endblock %}">
                <div class="nav-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20V10"/>
                        <path d="M18 20V4"/>
                        <path d="M6 20v-4"/>
                    </svg>
                </div>
                <span class="nav-label">Posicoes</span>
            </a>
        </div>
    </nav>

    <script src="{% static 'js/app.js' %}" defer></script>
    {% block extra_js %}{% endblock %}
</body>
</html>
