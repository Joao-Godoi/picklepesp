<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#0a0e1a" media="(prefers-color-scheme: dark)">
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <title>{% block title %}PicklePesp{% endblock %}</title>
    {% load static %}
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Open+Sans:wght@400;600;700&family=Poppins:wght@600;700;800;900&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'css/app.css' %}">
    {% block extra_head %}{% endblock %}
</head>
<body>
    <header class="top-bar">
        <div class="top-bar-inner">
            <a href="{% url 'home' %}" class="brand" aria-label="PicklePesp - Pagina Inicial">
                <picture class="brand-icon">
                    <source srcset="{% static 'images/logo.svg' %}" type="image/svg+xml">
                    <img src="{% static 'images/logo.png' %}" alt="" width="32" height="32">
                </picture>
                <span class="brand-text">PicklePesp</span>
            </a>
            <nav class="top-bar-nav {% block nav-class %}{% endblock %}">
                <a href="{% url 'home' %}" class="{% block nav-home-active %}{% endblock %}">Grupos</a>
                <a href="{% url 'playoffs' %}" class="{% block nav-playoffs-active %}{% endblock %}">Playoffs</a>
                <a href="{% url 'placements' %}" class="{% block nav-placements-active %}{% endblock %}">Disputa</a>
                <a href="{% url 'rankings' %}" class="{% block nav-rankings-active %}{% endblock %}">Ranking</a>
                <a href="{% url 'info' %}" class="{% block nav-info-active %}{% endblock %}">Info</a>
                <button class="theme-toggle" id="theme-toggle" aria-label="Alternar tema" title="Alternar tema claro/escuro">
                    <svg class="theme-icon-dark" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="theme-icon-light" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </button>
            </nav>
        </div>
    </header>

    <main class="content-area page-content">
        {% block content %}{% endblock %}
    </main>

    <nav class="nav-bottom">
        <div class="nav-bottom-inner">
            <a href="{% url 'home' %}" class="nav-item {% block nav-groups-active %}{% endblock %}">
                <div class="nav-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="3" y="3" width="7" height="7" rx="1"/>
                        <rect x="14" y="3" width="7" height="7" rx="1"/>
                        <rect x="3" y="14" width="7" height="7" rx="1"/>
                        <rect x="14" y="14" width="7" height="7" rx="1"/>
                    </svg>
                </div>
                <span class="nav-label">Grupos</span>
            </a>
            <a href="{% url 'playoffs' %}" class="nav-item {% block nav-playoffs-bar %}{% endblock %}">
                <div class="nav-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <polyline points="8 6 2 12 8 18"/>
                        <polyline points="16 6 22 12 16 18"/>
                    </svg>
                </div>
                <span class="nav-label">Playoffs</span>
            </a>
            <a href="{% url 'placements' %}" class="nav-item {% block nav-placements-bar %}{% endblock %}">
                <div class="nav-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M12 20V10"/>
                        <path d="M18 20V4"/>
                        <path d="M6 20v-4"/>
                    </svg>
                </div>
                <span class="nav-label">Disputa</span>
            </a>
            <a href="{% url 'rankings' %}" class="nav-item {% block nav-rankings-bar %}{% endblock %}">
                <div class="nav-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <line x1="18" y1="20" x2="18" y2="10"/>
                        <line x1="12" y1="20" x2="12" y2="4"/>
                        <line x1="6" y1="20" x2="6" y2="14"/>
                    </svg>
                </div>
                <span class="nav-label">Ranking</span>
            </a>
            <a href="{% url 'info' %}" class="nav-item {% block nav-info-bar %}{% endblock %}">
                <div class="nav-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="10"/>
                        <line x1="12" y1="16" x2="12" y2="12"/>
                        <line x1="12" y1="8" x2="12.01" y2="8"/>
                    </svg>
                </div>
                <span class="nav-label">Info</span>
            </a>
            <button class="nav-item" id="theme-toggle-mobile" aria-label="Alternar tema" title="Alternar tema claro/escuro" style="background:none;border:none;cursor:pointer;">
                <div class="nav-icon">
                    <svg class="theme-icon-dark" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
                    </svg>
                    <svg class="theme-icon-light" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="display:none;">
                        <circle cx="12" cy="12" r="5"/>
                        <line x1="12" y1="1" x2="12" y2="3"/>
                        <line x1="12" y1="21" x2="12" y2="23"/>
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
                        <line x1="1" y1="12" x2="3" y2="12"/>
                        <line x1="21" y1="12" x2="23" y2="12"/>
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
                    </svg>
                </div>
                <span class="nav-label">Tema</span>
            </button>
        </div>
    </nav>

    <script src="{% static 'js/app.js' %}" defer></script>
    <script>
    (function(){
        var theme = localStorage.getItem('picklepesp-theme');
        if(theme==='light'||theme==='dark'){document.documentElement.setAttribute('data-theme',theme);}
        else if(window.matchMedia('(prefers-color-scheme:light)').matches){document.documentElement.setAttribute('data-theme','light');}
        function updateIcons(){
            var isLight=document.documentElement.getAttribute('data-theme')==='light';
            document.querySelectorAll('.theme-icon-dark').forEach(function(el){el.style.display=isLight?'none':'inline';});
            document.querySelectorAll('.theme-icon-light').forEach(function(el){el.style.display=isLight?'inline':'none';});
        }
        updateIcons();
        function toggle(){
            var cur=document.documentElement.getAttribute('data-theme');
            var next=cur==='light'?'dark':'light';
            document.documentElement.setAttribute('data-theme',next);
            localStorage.setItem('picklepesp-theme',next);
            updateIcons();
        }
        document.getElementById('theme-toggle').addEventListener('click',toggle);
        document.getElementById('theme-toggle-mobile').addEventListener('click',toggle);
    })();
    </script>
    {% block extra_js %}{% endblock %}
</body>
</html>
